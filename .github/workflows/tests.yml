name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: site/set-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Serve the site
        run: |
          python3 -m http.server 8765 --directory site >/dev/null 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:8765/set-app/ >/dev/null && break; sleep 1; done
      - name: Run browser tests
        run: NODE_PATH=$PWD/node_modules BASE=http://localhost:8765 node site/set-app/tests/smoke.js
