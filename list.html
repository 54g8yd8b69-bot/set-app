<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'none'; frame-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dental Set-App set-up list</title>
<style>
:root{--navy:#0B2E4A;--teal:#1C7293;--teal2:#3FA9A0;--bg:#F3F7F9;--card:#fff;--ink:#10273A;--mute:#566C7D;--line:#D5E0E7;--shadow:0 1px 2px rgba(34,52,61,.04);--hdr:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#E3ECF2;--teal:#4FB3C9;--teal2:#5CC3B7;--bg:#08141D;--card:#0F2130;--ink:#E3ECF2;--mute:#93A9B9;--line:#24394A;--shadow:0 1px 3px rgba(0,0,0,.5);--hdr:#0F2130}}
:root[data-theme="dark"]{--navy:#E3ECF2;--teal:#4FB3C9;--teal2:#5CC3B7;--bg:#08141D;--card:#0F2130;--ink:#E3ECF2;--mute:#93A9B9;--line:#24394A;--shadow:0 1px 3px rgba(0,0,0,.5);--hdr:#0F2130}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Calibri,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
h1,h2{font-family:inherit;font-weight:600;margin:0;line-height:1.25}
header{background:var(--hdr);color:var(--ink);padding:16px 18px;border-bottom:1px solid var(--line)}
header small{color:var(--teal);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:.75rem}
header h1{color:var(--navy);font-size:1.4rem;margin-top:4px}
header p{margin:6px 0 0;color:var(--mute);font-size:.95rem}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
h2{font-size:1.1rem;color:var(--navy);padding-bottom:4px;border-bottom:2px solid var(--teal2)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
li label{display:flex;gap:12px;align-items:center;flex:1;min-width:0;padding:11px 2px;min-height:48px;cursor:pointer}
li:last-child{border-bottom:0}
.pnl{display:none}.pnl.on{display:block}
#list.single .pnl{display:block}
.imgb{flex:none;width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;min-height:0}.imgb img{width:100%;height:100%;object-fit:cover;display:block}
@media print{.imgb{display:none!important}}
.sw{flex:none;width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25);-webkit-print-color-adjust:exact;print-color-adjust:exact}
li input{width:24px;height:24px;accent-color:var(--teal);flex:none}
li.done span{text-decoration:line-through;color:var(--mute)}
.prog{color:var(--mute);font-size:.95rem;margin:0 0 12px}
.msg{color:var(--mute);text-align:center;padding:28px 8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--teal);background:transparent;color:var(--teal);border-radius:10px;font-weight:500;padding:10px 14px;min-height:44px;cursor:pointer}
:focus-visible{outline:3px solid var(--teal2);outline-offset:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
header{animation:fadeUp .3s ease both}
main .card{animation:fadeUp .4s ease both}
main .card:nth-child(2){animation-delay:.06s}main .card:nth-child(3){animation-delay:.12s}main .card:nth-child(4){animation-delay:.18s}main .card:nth-child(n+5){animation-delay:.24s}
li span{transition:color .25s}
.tabs{display:flex;gap:4px;margin:0 0 12px;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;margin-bottom:-2px;background:none;color:var(--mute);border-radius:0;padding:8px 14px;min-height:44px;font-weight:500;white-space:nowrap}
.tabs button.on{color:var(--teal);border-bottom-color:var(--teal);font-weight:700}
.pm{color:var(--mute);font-size:.95rem;margin:0 0 10px}
li input.pop{animation:pop .24s ease}
button{transition:transform .12s,background-color .2s}
button:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.tabs{display:none}.pnl{display:block!important;break-after:page}header{background:#fff;color:#000}header h1{color:#000}.btns{display:none}body{background:#fff}.card{box-shadow:none}}
h1{font-family:Cambria,"Source Serif 4",Georgia,serif}
</style>
</head>
<body>

    <button type="button" id="reset">Clear ticks</button>
  </div>
</main>

function imgFor(t){var f=IMGMAP[String(t).replace(/ · .*$/,"").replace(/ \(\d+ mm\)$/,"")];return f&&IMGHAVE.indexOf(f)>-1?f:null}
function showImg(name){var f=imgFor(name),d=document.getElementById("imgDlg");if(!f||!d)return;d.querySelector("h2").textContent=String(name).replace(/ · .*$/,"");d.querySelector("img").src=IMGDATA[f];d.querySelector("img").alt=name;if(d.showModal)d.showModal();else d.setAttribute("open","")}
function el(t,c,s){var e=document.createElement(t);if(c)e.className=c;if(s!==undefined)e.textContent=s;return e}
function fmt(d){if(!d)return"";var x=new Date(d+"T12:00");return isNaN(x)?String(d):x.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
function key(h){var n=5381;for(var i=0;i<h.length;i++)n=((n<<5)+n+h.charCodeAt(i))|0;return"ticks:"+(n>>>0)}
function rd(k){try{return JSON.parse(localStorage.getItem(k)||"{}")||{}}catch(e){return{}}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function bytes(t){t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";var x=atob(t),a=new Uint8Array(x.length);for(var i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}
async function decode(h){var b=bytes(h.slice(1));if(h[0]==="u")return new TextDecoder().decode(b);if(h[0]==="c"){var s=new DecompressionStream("deflate-raw"),w=s.writable.getWriter();w.write(b);w.close();return new TextDecoder().decode(await new Response(s.readable).arrayBuffer())}throw new Error("v")}

function count(){var all=document.querySelectorAll("#list .pnl.on input, #list.single input"),n=0;all.forEach(function(c){if(c.checked)n++});$("prog").textContent=n+" of "+all.length+" ticked"}
var PA=0;
function secCards(sections,pi,parent){sections.forEach(function(sec,i){var items=Array.isArray(sec[1])?sec[1]:[];if(!items.length)return;
  var card=el("section","card"),ul=el("ul");card.appendChild(el("h2","",String(sec[0])+" ("+items.length+")"));
  items.forEach(function(t,j){var id=(pi===null?"":pi+":")+i+"-"+j,li=el("li"),lb=el("label"),cb=el("input"),sp=el("span","",String(t)),c=fileCol(String(t)),sw=null;if(c){sw=el("i","sw");sw.style.background=c[0];if(c[2])sw.style.borderColor=c[2]}cb.type="checkbox";cb.checked=!!ticks[id];li.className=cb.checked?"done":"";

   lb.appendChild(cb);if(sw)lb.appendChild(sw);lb.appendChild(sp);li.appendChild(lb);var imf=imgFor(t);if(imf){var ib=el("button","imgb");ib.type="button";ib.setAttribute("aria-label","Show photo of "+t);var im=el("img");im.src=IMGDATA[imf];im.alt="";im.loading="lazy";ib.appendChild(im);ib.onclick=function(){showImg(t)};li.appendChild(ib)}ul.appendChild(li)});
  card.appendChild(ul);parent.appendChild(card)})}

async function show(){var h=(location.hash||"").slice(1),d;$("tabs").hidden=true;$("list").className="";

 try{d=JSON.parse(await decode(h));if(!Array.isArray(d)||!(d[0]==="@p"?Array.isArray(d[3]):Array.isArray(d[5])))throw new Error("f")}catch(e){msg("This code couldn’t be read. It may be from an older version, so please ask for a new one.");return}
 K=key(h);ticks=rd(K);var out=$("list");out.textContent="";
 if(d[0]==="@p"){$("title").textContent="Set-up lists";$("meta").textContent=[d[2]&&"Clinician: "+d[2],fmt(d[1])].filter(Boolean).join(" · ");
  var tb=$("tabs");tb.textContent="";tb.hidden=false;PA=0;
  d[3].forEach(function(pt,i){var b=el("button","",String(pt[0]||"Patient "+(i+1)));b.type="button";b.setAttribute("role","tab");b.onclick=function(){setTab(i)};tb.appendChild(b);
   var pn=el("div","pnl");pn.appendChild(el("p","pm",[pt[1],pt[2]&&"System: "+pt[2],pt[3]&&"Room: "+pt[3]].filter(Boolean).join(" · ")));secCards(Array.isArray(pt[4])?pt[4]:[],i,pn);out.appendChild(pn)});
  $("btns").hidden=false;setTab(0);return}

 out.className="single";secCards(d[5],null,out);
 $("btns").hidden=false;count()}
